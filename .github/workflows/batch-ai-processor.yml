name: Nightly AI Batch Processor

on:
  schedule:
    - cron: '30 20 * * *'   # 2:00 AM IST = 20:30 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  process-pending-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      HF_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN || secrets.HF_TOKEN }}
      SUPABASE_STORAGE_BUCKET: civic-connect-data
      HF_SPACE_ID: Maharsh8805/CivicConnect-Classifier

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE != '' && env.HF_TOKEN != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE != '' && env.HF_TOKEN != '' }}
        run: |
          pip install -r scripts/batch_processor/requirements.txt

      - name: Run batch processor
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE != '' && env.HF_TOKEN != '' }}
        run: python scripts/batch_processor/process_jobs.py
